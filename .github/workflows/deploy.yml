name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Angular
        run: npx ng build --configuration production --base-href=/hgv-s-ost/

      - name: Find index.html location
        run: |
          echo "Searching for index.html..."
          find dist -name "index.html" -type f 2>/dev/null || echo "index.html NOT FOUND anywhere!"
          ls -la dist/stuttgart-ost-hgv/ 2>/dev/null || echo "dist/stuttgart-ost-hgv not found"
          ls -la dist/stuttgart-ost-hgv/browser/ 2>/dev/null || echo "browser subfolder not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/stuttgart-ost-hgv/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
